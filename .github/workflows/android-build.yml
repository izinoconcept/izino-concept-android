name: Build I.ZINO CONCEPT APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a GitHub Release on tags

env:
  # Optional repository *variable* (Settings > Secrets and variables > Actions > Variables).
  # Your real AdMob App ID (ca-app-pub-4163326546433333~6128040408). Falls back to Google's test ID.
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # ---------- Debug APK (always built, installable, uses Google TEST ad units) ----------
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IZinoConcept-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ---------- Signed release (only when keystore secrets are configured) ----------
      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "have_keystore=true" >> "$GITHUB_OUTPUT"; fi

      - name: Decode keystore
        if: steps.sign.outputs.have_keystore == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/izino-release.jks"

      - name: Build signed release APK + AAB
        if: steps.sign.outputs.have_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/izino-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload release artifacts
        if: steps.sign.outputs.have_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IZinoConcept-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
