plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def admobAppId = System.getenv('ADMOB_APP_ID') ?: (project.findProperty('ADMOB_APP_ID') ?: 'ca-app-pub-4163326546433333~6128040408')

android {
    namespace 'com.sunmaria.app358'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sunmaria.app358'   // must match google-services.json
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '3.1'

        manifestPlaceholders = [ADMOB_APP_ID: admobAppId]

        // ---- Values carried over from I_ZINO_CONCEPT.webapp ----
        buildConfigField 'String',  'HOME_URL', '"https://izinoconcept.github.io/"'
        buildConfigField 'String',  'HOME_HOST', '"izinoconcept.github.io"'
        buildConfigField 'String',  'STARTAPP_APP_ID', '"208869870"'
        buildConfigField 'int',     'SPLASH_DURATION_MS', '1800'
        buildConfigField 'long',    'INTERSTITIAL_INTERVAL_MS', '60000L'
        buildConfigField 'boolean', 'HTTPS_ONLY', 'true'
        buildConfigField 'boolean', 'EXT_LINK_CHECK', 'true'
        buildConfigField 'boolean', 'CONFIRM_EXIT', 'true'
        buildConfigField 'boolean', 'PULL_TO_REFRESH', 'true'
        buildConfigField 'boolean', 'LIVE_TOOLBAR_TITLE', 'true'
        buildConfigField 'boolean', 'DISALLOW_SCREENSHOT', 'false'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Google's sample ad units: never click real ads while testing (can get AdMob banned).
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"ca-app-pub-3940256099942544/1033173712"'
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-4163326546433333/3118733681"'
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"ca-app-pub-4163326546433333/4240243666"'
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'

    // Firebase (google-services.json): Cloud Messaging push + Analytics
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Start.io (StartApp) SDK + AdMob mediation adapter
    implementation 'com.startapp:inapp-sdk:5.+'
    
}
